<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Projekti</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('projekti')}"></div>

    <div class="container">
        <div class="table-header-container">
            <div>
                <h1 style="font-size: 2rem; font-weight: 700;">Lista Projekata</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">Pregled svih registrovanih projekata automatizacije.</p>
            </div>
            <a href="/projekti/novi" class="btn btn-success">Dodaj novi projekat</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Naziv Projekta</th>
                            <th>Klijent</th>
                            <th>Status</th>
                            <th style="width: 200px; text-align: center;">Akcije</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="projekat : ${projekti}">
                            <td th:text="${projekat.id}">1</td>
                            <td style="font-weight: 600;" th:text="${projekat.naziv}">Naziv</td>
                            <td th:text="${projekat.klijent}">Klijent</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${projekat.status == 'Završeno'} ? 'badge-success' : 'badge-info'"
                                      th:text="${projekat.status}">U radu</span>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 0.5rem;">
                                    <a th:href="@{/projekti/izmeni/{id}(id=${projekat.id})}" class="btn btn-warning btn-sm">Izmeni</a>
                                    <a th:href="@{/projekti/obrisi/{id}(id=${projekat.id})}" 
                                       th:onclick="return confirm('Da li ste sigurni da želite da obrišete ovaj projekat?')" 
                                       class="btn btn-danger btn-sm">Obriši</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(projekti)}">
                            <td colspan="5" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                Trenutno nema registrovanih projekata.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
