<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Forma za Projekat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('projekti')}"></div>

    <div class="container">
        <div class="form-card">
            <h2 th:text="${projekat.id == null} ? 'Novi Projekat' : 'Izmena Projekta'">Novi Projekat</h2>
            
            <form th:action="@{/projekti/sacuvaj}" th:object="${projekat}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label" for="naziv">Naziv Projekta</label>
                    <input type="text" id="naziv" th:field="*{naziv}" class="form-control" placeholder="Unesite naziv projekta" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="klijent">Klijent</label>
                    <input type="text" id="klijent" th:field="*{klijent}" class="form-control" placeholder="Unesite naziv klijenta" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" th:field="*{status}" class="form-control" required>
                        <option value="U radu">U radu</option>
                        <option value="Završeno">Završeno</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="/projekti" class="btn btn-secondary">Otkaži</a>
                    <button type="submit" class="btn btn-primary">Sačuvaj</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
