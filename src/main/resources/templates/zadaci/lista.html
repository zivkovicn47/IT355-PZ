<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Zadaci</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('zadaci')}"></div>

    <div class="container">
        <div class="table-header-container">
            <div>
                <h1 style="font-size: 2rem; font-weight: 700;">Zadaci Projekata</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">Pregled i raspodela inženjerskih zadataka po projektima.</p>
            </div>
            <a href="/zadaci/novi" class="btn btn-success">Dodaj novi zadatak</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Opis Zadatka</th>
                            <th>Projekat</th>
                            <th>Inženjer</th>
                            <th>Završen</th>
                            <th style="width: 200px; text-align: center;">Akcije</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="zadatak : ${zadaci}">
                            <td th:text="${zadatak.id}">1</td>
                            <td style="font-weight: 600;" th:text="${zadatak.opis}">Opis</td>
                            <td th:text="${service.getProjekatById(zadatak.projekatId) != null ? service.getProjekatById(zadatak.projekatId).naziv : 'Nepoznat projekat'}">Projekat</td>
                            <td th:text="${service.getInzenjerById(zadatak.inzenjerId) != null ? service.getInzenjerById(zadatak.inzenjerId).ime + ' ' + service.getInzenjerById(zadatak.inzenjerId).prezime : 'Nedodeljen'}">Inženjer</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${zadatak.zavrsen} ? 'badge-success' : 'badge-warning'"
                                      th:text="${zadatak.zavrsen} ? 'Završen' : 'U radu'">U radu</span>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 0.5rem;">
                                    <a th:href="@{/zadaci/izmeni/{id}(id=${zadatak.id})}" class="btn btn-warning btn-sm">Izmeni</a>
                                    <a th:href="@{/zadaci/obrisi/{id}(id=${zadatak.id})}" 
                                       th:onclick="return confirm('Da li ste sigurni da želite da obrišete ovaj zadatak?')" 
                                       class="btn btn-danger btn-sm">Obriši</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(zadaci)}">
                            <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                Trenutno nema registrovanih zadataka.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
