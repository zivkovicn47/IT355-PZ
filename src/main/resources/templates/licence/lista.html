<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatikom - Licence</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('licence')}"></div>

    <div class="container">
        <div class="table-header-container">
            <div>
                <h1 style="font-size: 2rem; font-weight: 700;">Softverske Licence</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">Pregled inženjerskih i runtime licenci softvera.</p>
            </div>
            <a href="/licence/novi" class="btn btn-success">Dodaj novu licencu</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Naziv Softvera</th>
                            <th>Ključ Licence</th>
                            <th>Tip Licence</th>
                            <th>Aktivna</th>
                            <th style="width: 200px; text-align: center;">Akcije</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="licenca : ${licence}">
                            <td th:text="${licenca.id}">1</td>
                            <td style="font-weight: 600;" th:text="${licenca.nazivSoftvera}">Softver</td>
                            <td th:text="${licenca.kljucLicence}">Ključ</td>
                            <td th:text="${licenca.tipLicence}">Tip</td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${licenca.aktivna} ? 'badge-success' : 'badge-danger'"
                                      th:text="${licenca.aktivna} ? 'Aktivna' : 'Neaktivna'">Aktivna</span>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 0.5rem;">
                                    <a th:href="@{/licence/izmeni/{id}(id=${licenca.id})}" class="btn btn-warning btn-sm">Izmeni</a>
                                    <a th:href="@{/licence/obrisi/{id}(id=${licenca.id})}" 
                                       th:onclick="return confirm('Da li ste sigurni da želite da obrišete ovu licencu?')" 
                                       class="btn btn-danger btn-sm">Obriši</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(licence)}">
                            <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                Trenutno nema registrovanih licenci.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
