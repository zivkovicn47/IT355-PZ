<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Forma za Licencu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('licence')}"></div>

    <div class="container">
        <div class="form-card">
            <h2 th:text="${licenca.id == null} ? 'Nova Licenca' : 'Izmena Licence'">Nova Licenca</h2>
            
            <form th:action="@{/licence/sacuvaj}" th:object="${licenca}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label" for="nazivSoftvera">Naziv Softvera</label>
                    <input type="text" id="nazivSoftvera" th:field="*{nazivSoftvera}" class="form-control" placeholder="Npr. TIA Portal V19" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="kljucLicence">Ključ Licence</label>
                    <input type="text" id="kljucLicence" th:field="*{kljucLicence}" class="form-control" placeholder="Unesite ključ licence" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="tipLicence">Tip Licence</label>
                    <input type="text" id="tipLicence" th:field="*{tipLicence}" class="form-control" placeholder="Npr. Floating, Single, Rental" required />
                </div>

                <div class="form-group">
                    <label class="form-checkbox">
                        <input type="checkbox" th:field="*{aktivna}" />
                        <span>Aktivna licenca</span>
                    </label>
                </div>

                <div class="form-actions">
                    <a href="/licence" class="btn btn-secondary">Otkaži</a>
                    <button type="submit" class="btn btn-primary">Sačuvaj</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
