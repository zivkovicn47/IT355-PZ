<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Inženjeri</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('inzenjeri')}"></div>

    <div class="container">
        <div class="table-header-container">
            <div>
                <h1 style="font-size: 2rem; font-weight: 700;">Inženjerski Tim</h1>
                <p style="color: var(--text-secondary); margin-top: 0.25rem;">Pregled svih registrovanih inženjera na projektima.</p>
            </div>
            <a href="/inzenjeri/novi" class="btn btn-success">Dodaj novog inženjera</a>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 80px;">ID</th>
                            <th>Ime</th>
                            <th>Prezime</th>
                            <th>Email</th>
                            <th>Uloga</th>
                            <th style="width: 200px; text-align: center;">Akcije</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="inzenjer : ${inzenjeri}">
                            <td th:text="${inzenjer.id}">1</td>
                            <td style="font-weight: 600;" th:text="${inzenjer.ime}">Ime</td>
                            <td style="font-weight: 600;" th:text="${inzenjer.prezime}">Prezime</td>
                            <td th:text="${inzenjer.email}">email@example.com</td>
                            <td>
                                <span class="badge badge-info" th:text="${inzenjer.uloga}">PLC Programer</span>
                            </td>
                            <td style="text-align: center;">
                                <div style="display: inline-flex; gap: 0.5rem;">
                                    <a th:href="@{/inzenjeri/izmeni/{id}(id=${inzenjer.id})}" class="btn btn-warning btn-sm">Izmeni</a>
                                    <a th:href="@{/inzenjeri/obrisi/{id}(id=${inzenjer.id})}" 
                                       th:onclick="return confirm('Da li ste sigurni da želite da obrišete ovog inženjera?')" 
                                       class="btn btn-danger btn-sm">Obriši</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(inzenjeri)}">
                            <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
                                Trenutno nema registrovanih inženjera.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
