<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Forma za Inženjera</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('inzenjeri')}"></div>

    <div class="container">
        <div class="form-card">
            <h2 th:text="${inzenjer.id == null} ? 'Novi Inženjer' : 'Izmena Inženjera'">Novi Inženjer</h2>
            
            <form th:action="@{/inzenjeri/sacuvaj}" th:object="${inzenjer}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label" for="ime">Ime</label>
                    <input type="text" id="ime" th:field="*{ime}" class="form-control" placeholder="Unesite ime" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="prezime">Prezime</label>
                    <input type="text" id="prezime" th:field="*{prezime}" class="form-control" placeholder="Unesite prezime" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email adresa</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="Unesite email" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="uloga">Uloga</label>
                    <input type="text" id="uloga" th:field="*{uloga}" class="form-control" placeholder="Npr. PLC Programer, SCADA Inženjer, Projektant" required />
                </div>

                <div class="form-actions">
                    <a href="/inzenjeri" class="btn btn-secondary">Otkaži</a>
                    <button type="submit" class="btn btn-primary">Sačuvaj</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
