<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Automatikom - Forma za Komponentu</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{zajedno/navbar :: headerNavbar('komponente')}"></div>

    <div class="container">
        <div class="form-card">
            <h2 th:text="${komponenta.id == null} ? 'Nova Komponenta' : 'Izmena Komponente'">Nova Komponenta</h2>
            
            <form th:action="@{/komponente/sacuvaj}" th:object="${komponenta}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label class="form-label" for="naziv">Naziv Komponente</label>
                    <input type="text" id="naziv" th:field="*{naziv}" class="form-control" placeholder="Unesite naziv komponente (npr. Siemens S7-1200 CPU)" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="serijskiBroj">Serijski Broj</label>
                    <input type="text" id="serijskiBroj" th:field="*{serijskiBroj}" class="form-control" placeholder="Unesite serijski broj" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="proizvodjac">Proizvođač</label>
                    <input type="text" id="proizvodjac" th:field="*{proizvodjac}" class="form-control" placeholder="Unesite proizvođača (npr. Siemens)" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="status">Status</label>
                    <select id="status" th:field="*{status}" class="form-control" required>
                        <option value="Na stanju">Na stanju</option>
                        <option value="Ugrađeno">Ugrađeno</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="/komponente" class="btn btn-secondary">Otkaži</a>
                    <button type="submit" class="btn btn-primary">Sačuvaj</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
